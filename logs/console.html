<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务控制台 · 原型</title>
<style>
  :root{
    --bg:#f7f8fa; --fg:#1a1d21; --dim:#6b7280; --line:#e3e6ea; --card:#fff;
    --ok:#127a4b; --bad:#b3261e; --warn:#8a5a00; --accent:#2f5bd4;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161a; --fg:#e6e8eb; --dim:#9aa1ab; --line:#2a2e35; --card:#1b1e24;
          --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#7aa2f7;}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
       font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:20px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .tile .n{font-size:25px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .l{color:var(--dim);font-size:12px;margin-top:3px}
  .tile.alert .n{color:var(--bad)}
  .tile.warn .n{color:var(--warn)}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;
          padding:15px 17px;margin-bottom:16px}
  section h2{font-size:13.5px;margin:0 0 11px;color:var(--dim);font-weight:620;
             text-transform:uppercase;letter-spacing:.05em}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
  .s-approved{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .s-rejected{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
  .s-blocked,.s-escalate{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .flag{color:var(--bad);font-weight:640}
  .empty{color:var(--dim);padding:14px 0;font-size:13px}
  .ts{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  footer{color:var(--dim);font-size:12px;margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<h1>任务控制台 <span style="color:var(--dim);font-weight:400">· 原型</span></h1>
<div class="sub" id="meta">加载中…</div>
<div class="grid" id="tiles"></div>

<section><h2>报告流 · 每次 json 传递</h2><div class="scroll"><table id="reports"></table></div></section>
<section><h2>闸门事件</h2><div class="scroll"><table id="events"></table></div></section>

<footer>
数据源 <code>logs/console.json</code>，由 <code>scripts/console.sh</code> 生成，
<code>scripts/mission_complete.sh</code> 通过后自动刷新。<br>
本页只读 Git 里已有的留痕，不引入新数据源 —— 它不是第二个事实源。
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = s => s ? String(s).replace('T',' ').replace(/(:\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)$/,'') : '—';

function tiles(m){
  const spec = [
    ['报告总数', m.reports_total, ''],
    ['打回', m.rejected, m.rejected ? 'warn' : ''],
    ['升级', m.escalated, m.escalated ? 'warn' : ''],
    ['指令异议', m.objections, m.objections ? 'warn' : ''],
    ['子代理重开', m.resumed, ''],
    ['考试未过', m.exam_fail, m.exam_fail ? 'alert' : ''],
    ['提交被拒', m.blocked, m.blocked ? 'alert' : ''],
    ['逃生口使用', m.override, m.override ? 'alert' : ''],
  ];
  $('#tiles').innerHTML = spec.map(([l,n,c]) =>
    `<div class="tile ${c}"><div class="n">${n ?? 0}</div><div class="l">${l}</div></div>`).join('');
}

function reports(rs){
  const t = $('#reports');
  if(!rs.length){ t.outerHTML = '<div class="empty">还没有任何 report.json。</div>'; return; }
  t.innerHTML = '<thead><tr><th>时间</th><th>角色 @ 模块</th><th>任务</th><th>状态</th>'
    + '<th>结论</th><th>升级面</th></tr></thead><tbody>' + rs.map(r => {
      const flags = [
        r.escalated ? '升级' : '',
        r.contract_touched ? '碰契约' : '',
        r.objections ? `异议 ${r.objections}` : '',
      ].filter(Boolean).join(' · ');
      return `<tr>
        <td class="ts">${short(r.ts)}</td>
        <td><b>${esc(r.role)}</b> @ ${esc(r.module)}<br><code>${esc(r.path)}</code></td>
        <td>${esc(r.task)}${r.tier?` <code>${esc(r.tier)}</code>`:''}</td>
        <td><span class="pill s-${esc(r.status)}">${esc(r.status)}</span></td>
        <td>${esc(r.summary)}</td>
        <td class="${flags?'flag':''}">${flags || '—'}</td></tr>`;
    }).join('') + '</tbody>';
}

function events(es){
  const t = $('#events');
  const gate = es.filter(e => ['exam','mission_complete','mission_blocked','mission_override'].includes(e.event));
  if(!gate.length){ t.outerHTML = '<div class="empty">还没有闸门事件。</div>'; return; }
  t.innerHTML = '<thead><tr><th>时间</th><th>事件</th><th>详情</th></tr></thead><tbody>'
    + gate.map(e => {
      let d = '', cls = '';
      if(e.event === 'exam'){ d = `${esc(e.role)} 得分 ${e.score}/5`; cls = e.pass ? '' : 'flag'; }
      else if(e.event === 'mission_override'){ d = `绕过理由：${esc(e.reason)}`; cls = 'flag'; }
      else { d = `${e.pass ?? 0} 通过 / ${e.fail ?? 0} 失败${e.failed ? ' · ' + esc(e.failed) : ''}`;
             cls = e.event === 'mission_blocked' ? 'flag' : ''; }
      return `<tr><td class="ts">${short(e.ts)}</td><td><code>${esc(e.event)}</code></td>
              <td class="${cls}">${d}</td></tr>`;
    }).join('') + '</tbody>';
}

fetch('console.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    $('#meta').textContent = `分支 ${d.branch} · 生成于 ${short(d.generated)}`;
    tiles(d.metrics || {}); reports(d.reports || []); events(d.events || []);
  })
  .catch(() => {
    $('#meta').innerHTML = '读不到 <code>console.json</code>。'
      + '先跑 <code>scripts/console.sh &gt; logs/console.json</code>；'
      + '若用 file:// 直接打开被浏览器拦截，请在仓根跑 <code>python3 -m http.server</code> 后访问 <code>/logs/console.html</code>。';
  });
</script>
</body>
</html>
