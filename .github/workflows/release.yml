# 发布：main 上打 vX.Y.Z 标签即触发。
#
#   1. 构建五张镜像（nexus-core / web / auth / mcp / agent），amd64 + arm64，推到 ghcr.io/dblsc1/，
#      标签 X.Y.Z 与 latest（带「-」的测试版如 v0.6.0-rc1 不打 latest，Release 标成预发布）；
#   2. 把 release/ 下的 compose 与两个安装脚本里的 __VERSION__ / __TAG__ 换成本版，
#      连同 ai-detector 四个平台的单文件（+ SHA256SUMS）、连接脚本需要的 Claude Code 钩子文件（+ SHA256SUMS）一起挂到 GitHub Release。
#
# 发布前的「装得起来吗」由 ci.yml 的「发布包」job 在每个 PR 上验（本地构建同样五张镜像，
# 用同样的安装脚本装一遍再冒烟），这里不重复。
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write     # 建 Release、传附件
  packages: write     # 推 ghcr

jobs:
  images:
    name: 镜像 · ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: honeycomb-nexus-core
            context: modules/nexus-core/code/backend
            file: modules/nexus-core/code/backend/Dockerfile
          - image: honeycomb-web
            context: .
            file: release/web.Dockerfile
          - image: honeycomb-auth
            context: .
            file: release/auth.Dockerfile
          - image: honeycomb-mcp
            context: modules/mcp/code/server
            file: modules/mcp/code/server/Dockerfile
          - image: honeycomb-agent
            context: modules/agent/code/backend
            file: modules/agent/code/backend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 版本号
        id: v
        # 带「-」的测试版（如 v0.6.0-rc1）不打 latest
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) ;; *) echo "latest=latest" >> "$GITHUB_OUTPUT" ;; esac
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dblsc1/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest && format('ghcr.io/dblsc1/{0}:latest', matrix.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

  pet-packages:
    name: 桌宠包
    uses: ./.github/workflows/pet-packages.yml
    with:
      tag: ${{ github.ref_name }}

  release:
    name: GitHub Release
    needs: [images, pet-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false   # 与 ci.yml 的 ai-detector job 同版本，零第三方依赖不用缓存
      - name: 填版本号
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          sed "s/__VERSION__/$v/g" release/docker-compose.yml > dist/docker-compose.yml
          sed "s/__TAG__/$GITHUB_REF_NAME/g" release/honeycomb-install.sh > dist/honeycomb-install.sh
          sed "s/__TAG__/$GITHUB_REF_NAME/g" release/honeycomb-install.ps1 > dist/honeycomb-install.ps1
          sed "s/__TAG__/$GITHUB_REF_NAME/g" release/honeycomb-connect.sh > dist/honeycomb-connect.sh
          sed "s/__TAG__/$GITHUB_REF_NAME/g" release/honeycomb-connect.ps1 > dist/honeycomb-connect.ps1
          for f in claude_hook.py cockpit_client.py; do cp tools/agent-hooks/$f dist/agent-hooks-$f; done
          ( cd dist && sha256sum agent-hooks-claude_hook.py agent-hooks-cockpit_client.py > agent-hooks-SHA256SUMS.txt )
          for f in assets-download.js download-server.js manifest.json mood-map.json; do cp modules/desktop-pet/$f dist/pets-$f; done
          ! grep -l '__VERSION__\|__TAG__' dist/*
      - name: 构建 ai-detector 桌面单文件
        # 目标四组与 ci.yml「三系统都能编过」一致；这里额外加 -trimpath -ldflags "-s -w" 瘦身。
        # ai-detector 没有版本变量／--version（见 main.go），版本信息就在文件名和 SHA256SUMS 里。
        working-directory: modules/ai-detector
        run: |
          for t in linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*} arch=${t#*/}
            out="$GITHUB_WORKSPACE/dist/ai-detector-$GITHUB_REF_NAME-$os-$arch"
            [ "$os" = windows ] && out="$out.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" .
          done
          ( cd "$GITHUB_WORKSPACE/dist" && sha256sum ai-detector-* > "ai-detector-$GITHUB_REF_NAME-SHA256SUMS.txt" )
      - uses: actions/download-artifact@v4
        with:
          pattern: pet-*
          path: pet-zips
          merge-multiple: true
      - name: 桌宠包 + SHA256SUMS
        run: |
          cp pet-zips/honeycomb-pet-*.zip dist/
          ( cd dist && sha256sum honeycomb-pet-*.zip > "honeycomb-pet-$GITHUB_REF_NAME-SHA256SUMS.txt" && cat "honeycomb-pet-$GITHUB_REF_NAME-SHA256SUMS.txt" )
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "HoneyComb $GITHUB_REF_NAME" \
            --notes-file release/NOTES.md \
            --verify-tag \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)

  public-check:
    # ghcr 新包缺省私有，小白匿名拉不下来（安装脚本在 pull 那一步失败）。
    # 可见性只能在网页上改（没有 API），这里至少让它响亮地红，而不是等用户来报。
    name: 镜像能匿名拉吗
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 匿名 manifest
        run: |
          v=${GITHUB_REF_NAME#v}; bad=0
          for i in honeycomb-nexus-core honeycomb-web honeycomb-auth honeycomb-mcp honeycomb-agent; do
            if docker manifest inspect "ghcr.io/dblsc1/$i:$v" >/dev/null 2>&1; then echo "ok    $i"
            else echo "::error::ghcr.io/dblsc1/$i 匿名拉不到：到 GitHub → Packages → $i → Package settings → Change visibility 改成 Public"; bad=1; fi
          done
          exit $bad
