name: ci
on:
  # main 是正式版；dev 是 0.2.x 修复线（修完从 dev 发补丁版）；
  # v0.3 是 0.3 的开发线（功能分支合进 v0.3，定期把 dev 的修复合进来）。
  pull_request:
    branches: [main, dev, v0.3]
  push:
    branches: [main, dev, v0.3]
permissions:
  contents: read
jobs:
  test-nexus-core:
    name: nexus-core 测试
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.hello().ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    defaults:
      run:
        working-directory: modules/nexus-core/code/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 建 venv 并装依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: pytest
        env:
          NEXUS_MONGO_URI: mongodb://127.0.0.1:27017
          NEXUS_DB_NAME: nexus_core_test
          NEXUS_TZ: Asia/Shanghai
        run: |
          F1=tests/test_delete_event.py
          F2=tests/test_prune_orphan_events.py
          T1=test_t4_gate4_apply_deletes_exactly_one_and_rebuilds
          T2=test_p5_apply_deletes_only_orphans_and_rebuilds
          .venv/bin/python -m pytest -q \
            --deselect "$F1::$T1" \
            --deselect "$F2::$T2"

  mcp:
    name: mcp 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/mcp/code/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pytest
        # 服务本身纯标准库；测试起一个假 nexus-core，不连 mongo、不起容器。
        run: |
          pip install -q pytest
          python -m pytest -q tests

  hive-tests:
    name: hive 前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑测试
        # 纯逻辑，node 内置 assert，无 npm 依赖、无浏览器。
        # run_tests.sh 缺 node 时非零退出，不静默跳过。
        env:
          # 这套测试断言的是**本地时区**下的显示（产品按本地时区格式化时刻），
          # 断言写死了 UTC+8 的期望值。runner 是 UTC，不钉时区就 '13:05' != '21:05'。
          # 与 nexus-core 那个 job 的 NEXUS_TZ 取同一个值。
          TZ: Asia/Shanghai
        run: modules/hive/code/frontend/run_tests.sh

  ai-detector:
    name: ai-detector 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/ai-detector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false   # 零第三方依赖，没有 go.sum 可做缓存键
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet + test
        # 全部用 httptest 假服务，不装 ActivityWatch、不连网。
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: 三系统都能编过
        run: |
          for t in linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done

  ring-tokens:
    name: ring 令牌兜底
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 契约必须可达
        # 脚本对「契约不可达」的处理是 skip 后 exit 0 —— 那是为「ring 被单独
        # clone 出去测」设计的，在本仓不成立：contracts/ 和 ring 同仓，永远可达。
        # 不加这道，契约一旦被挪走 CI 照样绿，而它什么都没测。
        run: test -f contracts/design-tokens-v1.md
      - name: 跑检测
        # 纯 stdlib，不装任何东西。退出码就是判据。
        run: python3 modules/ring/code/frontend/tests/check_tokens_fallback.py

  ring-e2e:
    name: ring 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/ring/code/frontend/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # 不要升。playwright 1.49.1 拉的 greenlet 没有 3.13+ 的 wheel，
          # 在新版 python 上装不了：Failed building wheel for greenlet。
          python-version: '3.12'
      - name: 装依赖
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: pytest
        # 不走 run.sh —— 它在依赖不全时打印装法然后 exit 0，在 CI 里是假绿。
        # screenshot_dropdown.py 是截图工具不是测试，pytest 不会收集它。
        run: python -m pytest . -q -rs

  installer:
    name: 安装器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 装依赖
        # add 要解析 module.yaml 的嵌套结构，需要 pyyaml；list/plan/doctor 零依赖。
        run: pip install -q pyyaml pytest
      - name: 单测
        # tools/agent-hooks（cockpit-run + Claude Code 会话钩子）纯标准库，
        # 跟着 `tools` 这一整棵一起收集，不用单独列。
        run: python -m pytest -q tools modules/nginx-docker/tests contracts/auth.gate.v1/tests
      - name: 解依赖 + 生成 + 核对
        run: |
          # mcp 要点名：在聊天后端模块（consumes mcp.tools.v1）进来之前，hive ring 拉不到它
          ./install.sh plan hive ring mcp
          ./install.sh add hive ring mcp
          ./install.sh doctor
      - name: 两份 compose 都能解析
        env:
          HONEYCOMB_PASSWORD: config-check-only
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/generated/docker-compose.yml config -q

  compose-smoke:
    # 真起一遍，从门外走：跳登录、登录、两个前端和它们引用的每个资源。
    # 手写的默认组装与 install.sh 生成的那份各跑一遍——「生成的等价于手写的」
    # 不能只靠比服务名，得真跑。
    # 另各按整站挂子路径（HONEYCOMB_BASE_PATH=/Cockpit/，gateway.v1）再跑一遍。
    name: 组装冒烟 · ${{ matrix.dir }} · ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [deploy, deploy/generated]
        base: ['/', '/Cockpit/']
    env:
      HONEYCOMB_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: matrix.dir == 'deploy/generated'
        with:
          python-version: '3.12'
      - name: 生成组装
        if: matrix.dir == 'deploy/generated'
        run: |
          pip install -q pyyaml
          ./install.sh add hive ring mcp
      - name: 写 .env
        # 只填口令，其余照 README 用默认值（含 Secure cookie）：测的就是用户拿到的那份。
        run: |
          sed -e 's/^HONEYCOMB_PASSWORD=.*/HONEYCOMB_PASSWORD=ci-smoke-password/' \
              deploy/.env.example > ${{ matrix.dir }}/.env
          echo "HONEYCOMB_BASE_PATH=${{ matrix.base }}" >> ${{ matrix.dir }}/.env
      - name: 放一个同名的旧镜像
        # 机器上已有同名镜像时，compose 必须照样按源码构建，不许拿旧的跑。
        # 这里用 hello-world 冒充：真被拿去跑，nexus-core 健康检查过不了，up 就红。
        run: |
          docker pull -q hello-world
          docker tag hello-world honeycomb-nexus-core:local
      - name: 起
        working-directory: ${{ matrix.dir }}
        run: docker compose up -d --wait --wait-timeout 300
      - name: 冒烟
        run: deploy/smoke.sh ci-smoke-password
      - name: 灌演示数据（照 README）
        run: HONEYCOMB_PASSWORD=ci-smoke-password python3 seed/seed_demo.py --base "http://127.0.0.1:8800${HONEYCOMB_BASE_PATH%/}"
      - name: 失败时的日志
        if: failure()
        working-directory: ${{ matrix.dir }}
        run: docker compose logs --no-color
      - name: 拆
        if: always()
        working-directory: ${{ matrix.dir }}
        run: docker compose down -v

  accounts:
    # 占位认证的账号+密码登录（auth.gate v1.1）+ nexus-core 按租户分数据（v2.0），
    # 按 README「多个账号」那一节的步骤真起一遍：两个账号，数据互不可见。
    # 同一套栈再验设备令牌（v1.2）：令牌过网关只开 /api/core/*，开不了页面，吊销即失效。
    name: 多账号
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7
      - name: 写 .env（不设共享口令，开严格模式；设 AUTH_SECRET 才发设备令牌）
        run: |
          sed -e 's/^NEXUS_TENANT_STRICT=.*/NEXUS_TENANT_STRICT=1/' .env.example > .env
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> .env
      - name: 加账号
        run: |
          for u in alice bob; do
            echo ci-accounts-pw | docker compose run --rm -T auth python /app/auth_stub.py adduser "$u"
          done
      - name: 起
        run: docker compose up -d --wait --wait-timeout 300
      - name: 多账号
        run: test/accounts.sh ci-accounts-pw
      - name: 设备令牌（auth.gate v1.2）
        run: test/tokens.sh ci-accounts-pw
      - name: MCP（mcp.tools.v1，令牌经网关、两个账号互不可见）
        run: test/mcp.sh ci-accounts-pw
      - name: 失败时的日志
        if: failure()
        run: docker compose logs --no-color
      - name: 拆
        if: always()
        run: docker compose down -v

  release-package:
    # 发布包（release/）在打标签之前就得证明装得起来：本地构建同样四张镜像，
    # 用发布出去的同一个安装脚本（sh 与 PowerShell 各一遍）从空目录装，再冒烟；
    # 再跑一次 sh = 升级路径，必须保留原来的 .env 与数据。
    name: 发布包
    runs-on: ubuntu-latest
    env:
      HONEYCOMB_NO_PULL: '1'
    steps:
      - uses: actions/checkout@v7
      - name: 构建镜像（与 release.yml 同样四张，只构建本机架构）
        run: |
          docker build -q -t ghcr.io/dblsc1/honeycomb-nexus-core:ci modules/nexus-core/code/backend
          docker build -q -t ghcr.io/dblsc1/honeycomb-web:ci -f release/web.Dockerfile .
          docker build -q -t ghcr.io/dblsc1/honeycomb-auth:ci -f release/auth.Dockerfile .
          docker build -q -t ghcr.io/dblsc1/honeycomb-mcp:ci modules/mcp/code/server
      - name: 填版本号（同 release.yml）
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          sed 's/__VERSION__/ci/g' release/docker-compose.yml > "$RUNNER_TEMP/assets/docker-compose.yml"
          sed 's/__TAG__/ci/g' release/honeycomb-install.sh > "$RUNNER_TEMP/assets/honeycomb-install.sh"
          sed 's/__TAG__/ci/g' release/honeycomb-install.ps1 > "$RUNNER_TEMP/assets/honeycomb-install.ps1"
      - name: sh 安装 + 冒烟
        run: |
          export HONEYCOMB_ASSETS="$RUNNER_TEMP/assets" HONEYCOMB_DIR="$RUNNER_TEMP/sh/honeycomb"
          sh "$RUNNER_TEMP/assets/honeycomb-install.sh"
          pw=$(sed -n 's/^HONEYCOMB_PASSWORD=//p' "$HONEYCOMB_DIR/.env")
          deploy/smoke.sh "$pw"
          echo "PW=$pw" >> "$GITHUB_ENV"
      - name: 再跑一次 = 升级（保留 .env 与数据）
        run: |
          export HONEYCOMB_ASSETS="$RUNNER_TEMP/assets" HONEYCOMB_DIR="$RUNNER_TEMP/sh/honeycomb"
          sh "$RUNNER_TEMP/assets/honeycomb-install.sh" | tee out.txt
          grep -q '这次是升级' out.txt
          deploy/smoke.sh "$PW"
      - name: 同一台机器装第二份（换目录换端口）不许接管第一份
        # v0.2.5 在 Windows 实测：项目名写死 honeycomb，第二份把第一份的 web / auth
        # 重建成自己的口令和端口、两份共用数据卷。第二份必须自动另起项目名。
        run: |
          export HONEYCOMB_ASSETS="$RUNNER_TEMP/assets" HONEYCOMB_DIR="$RUNNER_TEMP/sh2/honeycomb" HONEYCOMB_BIND=127.0.0.1:8801
          sh "$RUNNER_TEMP/assets/honeycomb-install.sh"
          grep -qx 'HONEYCOMB_PROJECT=honeycomb-2' "$HONEYCOMB_DIR/.env"
          grep -qx 'HONEYCOMB_PROJECT=honeycomb' "$RUNNER_TEMP/sh/honeycomb/.env"
          pw2=$(sed -n 's/^HONEYCOMB_PASSWORD=//p' "$HONEYCOMB_DIR/.env")
          deploy/smoke.sh "$PW"                          # 第一份：原口令、原端口照常
          deploy/smoke.sh "$pw2" http://127.0.0.1:8801    # 第二份：自己的口令、自己的端口
          # 数据真隔离：两份的 mongo / auth 实际挂载的卷逐个不同（只数卷的个数证明不了）
          for svc in mongo auth; do
            a=$(docker inspect -f '{{range .Mounts}}{{.Name}} {{end}}' honeycomb-$svc-1)
            b=$(docker inspect -f '{{range .Mounts}}{{.Name}} {{end}}' honeycomb-2-$svc-1)
            echo "$svc: $a | $b"
            test -n "$a" && test -n "$b" && test "$a" != "$b"
            for x in $b; do case " $a " in *" $x "*) echo "共用卷 $x"; exit 1;; esac; done
          done
          (cd "$HONEYCOMB_DIR" && docker compose down -v)
          (cd "$RUNNER_TEMP/sh/honeycomb" && docker compose down -v)
      - name: PowerShell 安装 + 冒烟
        shell: pwsh
        run: |
          $env:HONEYCOMB_ASSETS = "$env:RUNNER_TEMP/assets"
          $env:HONEYCOMB_DIR = "$env:RUNNER_TEMP/ps/honeycomb"
          & "$env:RUNNER_TEMP/assets/honeycomb-install.ps1"
          if ($LASTEXITCODE) { exit 1 }
          $pw = (Select-String -Path "$env:HONEYCOMB_DIR/.env" -Pattern '^HONEYCOMB_PASSWORD=(.*)$').Matches[0].Groups[1].Value
          bash "$env:GITHUB_WORKSPACE/deploy/smoke.sh" $pw
          if ($LASTEXITCODE) { exit 1 }
          if ((Get-Location).Path -ne $env:GITHUB_WORKSPACE) { Write-Error '安装脚本改了调用方的当前目录'; exit 1 }
          if ((stat -c %a "$env:HONEYCOMB_DIR/.env") -ne '600') { Write-Error '.env 权限不是 600'; exit 1 }
      - name: 失败时的日志
        if: failure()
        run: |
          for d in "$RUNNER_TEMP/sh/honeycomb" "$RUNNER_TEMP/sh2/honeycomb" "$RUNNER_TEMP/ps/honeycomb"; do
            [ -d "$d" ] && (cd "$d" && docker compose logs --no-color) || true
          done

  release-ps51:
    # Windows 自带的 PowerShell 5.1：runner 上跑不了 Linux 容器，只能验到「装 docker 之前」：
    # 文件按 UTF-8 BOM 正确解码（中文不乱码）、5.1 能解析整个脚本、随机口令写法 5.1 有。
    # 下面这段 run 只许写 ASCII：runner 把它存成无 BOM 的临时 .ps1，5.1 会按 GBK/1252 读。
    name: 发布包 · PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 5.1 解析 + 关键写法
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $src = Get-Content -Raw release/honeycomb-install.ps1
          $needle = -join [char[]](0x4E00, 0x952E, 0x5B89, 0x88C5)   # the 4 CJK chars of the script title
          if (-not $src.Contains($needle)) { throw 'BOM/encoding wrong: PowerShell 5.1 reads the CJK text as mojibake' }
          $null = [scriptblock]::Create($src)
          $b = New-Object byte[] 16
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
          if ((-join ($b | ForEach-Object { '{0:x2}' -f $_ })).Length -ne 32) { throw 'random password code does not work on 5.1' }
          # Invoke-Native under 5.1 + ErrorActionPreference=Stop: a native command that writes
          # to stderr must NOT throw, output must be captured, exit code must survive.
          $m = [regex]::Match($src, '(?s)function Invoke-Native.*?\r?\n}\r?\n')
          if (-not $m.Success) { throw 'Invoke-Native not found in installer' }
          Invoke-Expression $m.Value
          $ErrorActionPreference = 'Stop'
          $out = Invoke-Native { cmd /c "echo progress-line 1>&2 & exit 0" }
          if ($LASTEXITCODE -ne 0 -or ($out -join ' ') -notmatch 'progress-line') { throw "stderr capture failed: $out" }
          $out = Invoke-Native { cmd /c "echo boom 1>&2 & exit 3" }
          if ($LASTEXITCODE -ne 3) { throw "exit code lost: $LASTEXITCODE" }
          'Invoke-Native ok on ' + $PSVersionTable.PSVersion
          exit 0   # the runner exits with $LASTEXITCODE, still 3 from the deliberate failing case above

  gateway-contract:
    # contracts/gateway.v1 的冻结接口，从门外验：部署方只靠 override + .env
    # 换认证服务、关掉占位件、加一条受门保护的路由；客户端伪造的租户头到不了后端。
    name: 网关契约
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7
      - name: 写 .env
        run: |
          sed -e 's/^HONEYCOMB_PASSWORD=.*/HONEYCOMB_PASSWORD=ci-gateway-password/' .env.example > .env
          echo 'HONEYCOMB_EXTRA_ROUTES_DIR=./test/extra' >> .env
          echo 'AGENT_UPSTREAM=agentecho:8030' >> .env
      - name: 起（带部署方的 override）
        run: docker compose -f docker-compose.yml -f test/override.yml up -d --wait --wait-timeout 300
      - name: 契约
        run: test/gateway_contract.sh ci-gateway-password
      - name: 缺省组装仍然完整
        # override 把 mcp 关掉了（验「缺了 AI 桥网关照常起」），冒烟跳过 MCP 那段
        env:
          HONEYCOMB_SMOKE_MCP: '0'
        run: ./smoke.sh ci-gateway-password
      - name: 失败时的日志
        if: failure()
        run: docker compose -f docker-compose.yml -f test/override.yml logs --no-color
      - name: 拆
        if: always()
        run: docker compose -f docker-compose.yml -f test/override.yml down -v

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
