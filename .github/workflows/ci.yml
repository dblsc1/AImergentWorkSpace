name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-nexus-core:
    name: nexus-core 测试
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.hello().ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    defaults:
      run:
        working-directory: modules/nexus-core/code/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 建 venv 并装依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: pytest
        env:
          NEXUS_MONGO_URI: mongodb://127.0.0.1:27017
          NEXUS_DB_NAME: nexus_core_test
          NEXUS_TZ: Asia/Shanghai
        run: |
          F1=tests/test_delete_event.py
          F2=tests/test_prune_orphan_events.py
          T1=test_t4_gate4_apply_deletes_exactly_one_and_rebuilds
          T2=test_p5_apply_deletes_only_orphans_and_rebuilds
          .venv/bin/python -m pytest -q \
            --deselect "$F1::$T1" \
            --deselect "$F2::$T2"

  hive-tests:
    name: hive 前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑测试
        # 纯逻辑，node 内置 assert，无 npm 依赖、无浏览器。
        # run_tests.sh 缺 node 时非零退出，不静默跳过。
        run: modules/hive/code/frontend/run_tests.sh

  ring-tokens:
    name: ring 令牌兜底
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 契约必须可达
        # 脚本对「契约不可达」的处理是 skip 后 exit 0 —— 那是为「ring 被单独
        # clone 出去测」设计的，在本仓不成立：contracts/ 和 ring 同仓，永远可达。
        # 不加这道，契约一旦被挪走 CI 照样绿，而它什么都没测。
        run: test -f contracts/design-tokens-v1.md
      - name: 跑检测
        # 纯 stdlib，不装任何东西。退出码就是判据。
        run: python3 modules/ring/code/frontend/tests/check_tokens_fallback.py

  ring-e2e:
    name: ring 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/ring/code/frontend/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # 不要升。playwright 1.49.1 拉的 greenlet 没有 3.13+ 的 wheel，
          # 在新版 python 上装不了：Failed building wheel for greenlet。
          python-version: '3.12'
      - name: 装依赖
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: pytest
        # 不走 run.sh —— 它在依赖不全时打印装法然后 exit 0，在 CI 里是假绿。
        # screenshot_dropdown.py 是截图工具不是测试，pytest 不会收集它。
        run: python -m pytest . -q -rs

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
