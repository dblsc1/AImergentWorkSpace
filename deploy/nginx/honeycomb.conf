# HoneyComb 组装层 · 唯一入口
#
# 改自 v0.1（单人自用版，没有登录层）。这版加了登录门：auth.gate.v1 的占位实现
# 挡在 /api/ 与两个前端（/hive/ 任务蜂巢、/ring/ 计时台）前面，未登录一律跳 /login/。
# 前端代码不复制：docker-compose.yml 把 modules/<名>/code/frontend 只读挂进来。
#
# 这是手写的默认组装。`./install.sh add hive ring` 从各模块的 module.yaml 生成
# 行为相同的一份（deploy/generated/），CI 两份都起一遍核对。
server {
    listen 80;
    server_name _;
    charset utf-8;

    # 跳转一律用相对 Location（2026-09-14 真机 bug）：
    # 默认 absolute_redirect on 时 nginx 会拿 $host 拼绝对 URL，而 $host **不带端口**，
    # 于是 http://IP:8800/ 的 302 跳到了 http://IP/hive/ —— 打到 80 端口上，
    # 那里通常是别的服务，浏览器看到的就是「自动转 /hive/ 然后 502」。
    # 关掉它，Location 就是裸的 /hive/，端口由浏览器沿用。
    absolute_redirect off;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # 根路径跳主界面（任务蜂巢）。未登录的话 /hive/ 自己会再跳 /login/，
    # 登录页登录成功后默认回 /，于是又落到这里 —— 一圈下来正好进蜂巢。
    location = / { return 302 /hive/; }

    # 401 的统一去处：auth_request 判定未登录时，各受保护 location 用
    # error_page 401 = @to_login 跳到这里。
    location @to_login {
        return 302 /login/;
    }

    # ── 登录门（auth.gate.v1）──────────────────────────────────────
    #
    # /__auth_verify 是内部子请求专用：nginx 的 auth_request 指令会在放行
    # 每个受保护请求之前先内部调它一次，2xx＝放行、401/403＝拒绝（跳 @to_login）。
    # 它必须 internal——不许被外部直接请求到，也正因为在每个受保护请求的关键
    # 路径上，body 一律不转发（子请求本来就不需要，转了纯粹浪费）。
    location = /__auth_verify {
        internal;
        proxy_pass http://auth:8010/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 登录本身、登出、健康检查都不能被 auth_request 挡住——挡住就是自指死锁
    # （验证接口不能要求先通过验证）。
    location /api/auth/ {
        proxy_pass http://auth:8010;
        proxy_set_header Host $host;
    }

    # 登录页：contracts/auth.gate.v1/stub/web/ 的静态文件（index.html +
    # login.js），由 docker-compose.yml 的 web 服务只读挂载进本容器（见该
    # 文件 web.volumes）。换掉整个 auth 实现时，登录页跟着 stub/web/ 一起换，
    # 这条 location 不用动——它只认本地路径，不关心页面出自哪个实现。
    #
    # 不设门（不加 auth_request）：给登录页设门是自指死锁——登录页本身就是
    # 用来让未登录的人完成登录的，若访问它也要求先登录，任何人永远进不来。
    location /login/ {
        alias /usr/share/nginx/html/login/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── 受保护区 ────────────────────────────────────────────────────
    #
    # 顶栏那个"正在计时"的小芯片只打这一个端点（约 10s 一次），固定映射到
    # /api/core/views/current。
    #
    # **它必须设门**：这个端点返回的是"你此刻在做哪个分区/项目/任务"，
    # 是用户数据。不设门等于任何人不登录就能读到你正在做什么。
    #
    # 但 401 不能跳登录页 —— 这是个每 10s 一次的 XHR，给它一个 302 毫无意义。
    # 所以 401 复用 @cockpit_degraded，未登录时它拿到
    # {"degraded":true,"running":false}，顶栏渲染成空，既不泄露也不刷 console 错误。
    # 这样"顶栏在登录页上也能渲染"和"不泄露用户数据"两件事同时成立。
    location = /__cockpit/current {
        auth_request /__auth_verify;
        error_page 401 = @cockpit_degraded;
        proxy_pass http://nexus-core:8000/api/core/views/current;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @cockpit_degraded;
    }
    location @cockpit_degraded {
        default_type application/json;
        return 200 '{"degraded":true,"running":false}';
    }

    # 后端。真正挡人的地方：每个请求先过 /__auth_verify，401 就跳登录页。
    location /api/ {
        auth_request /__auth_verify;
        error_page 401 = @to_login;

        proxy_pass http://nexus-core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 前端页面本身也设门：未登录直接去登录页，而不是先渲染一个空壳、
    # 再让里面每个 /api/ 请求挨个 401。
    #
    # 任务蜂巢（modules/hive）。它的顶栏、图标在自己目录的 shared/ 下，
    # 页面用相对路径引用，跟着 /hive/ 一起出去，不需要单独的 /shared/。
    location /hive/ {
        auth_request /__auth_verify;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/hive/;
        index index.html;
        try_files $uri $uri/ /hive/index.html;
    }

    # 计时台（modules/ring）。
    location /ring/ {
        auth_request /__auth_verify;
        error_page 401 = @to_login;
        alias /usr/share/nginx/html/ring/;
        index project-task-contribution-ring.html;
        try_files $uri $uri/ /ring/project-task-contribution-ring.html;
    }
}
