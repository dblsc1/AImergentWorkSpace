# HoneyComb 组装层 · docker-compose
#
# 这是「组装层」，不含任何业务代码——nexus-core 的 build context 直接指到
# ../modules/nexus-core/code/backend，auth 直接挂载
# ../contracts/auth.gate.v1/stub/auth_stub.py。改代码去对应模块/契约目录改，
# 这里只负责把它们拼成一个能跑的站点（compose + nginx）。
#
# 起：docker compose up -d        停：docker compose down
# 起之前必须先设 HONEYCOMB_PASSWORD（见 .env.example）——auth 服务没有默认口令，
# 没设直接拒绝启动，不会带着"没有门"的状态跑起来。
# 起来之后开 http://127.0.0.1:8800/（默认只绑回环，见下）。
#
# 四个服务：
#   mongo  存数据（事件台账 + 投影）
#   nexus-core  事件溯源的计时与任务内核（FastAPI）
#   auth   auth.gate.v1 的占位实现，单口令登录门（标准库 http.server，零依赖）
#   web    nginx，唯一入口：serve /hive/ 与 /ring/ 两个前端、反代 /api/ 到
#          nexus-core、/api/auth/ 到 auth，在前端与 /api/ 前面插一道 auth_request 校验
#
# 只有 web 映射宿主端口，默认绑 127.0.0.1:8800（局域网/公网部署自己改
# HONEYCOMB_BIND 并在前面加 TLS，见 README）。mongo、nexus-core、auth 只在内部
# bridge 网里，外面够不到。
#
# 数据落在 named volume honeycomb_mongo_data —— `docker compose down` 不会删它，
# 要连数据一起删是 `docker compose down -v`。
#
# 项目名与容器名都跟着 HONEYCOMB_PROJECT 走（缺省 honeycomb）。
#
# 为什么要留这个覆盖点：compose 用项目名认领容器。同一台机器上如果已经跑着
# 另一套同名的 honeycomb，`docker compose up` **不会报错**，它会认为那些正在跑
# 的容器就是自己的，然后按这份配置把它们换掉。2026-09-17 真机踩过这一下。
# 把名字写死等于堵掉 compose 原生的项目名覆盖，所以这里必须是个变量。
name: ${HONEYCOMB_PROJECT:-honeycomb}

networks:
  honeycomb-net:
    driver: bridge

volumes:
  honeycomb_mongo_data:
  # 占位认证的账号文件（账号+密码登录，auth.gate v1.1）。只开共享口令时它是空的。
  honeycomb_auth_data:

services:
  mongo:
    image: mongo:7
    container_name: ${HONEYCOMB_PROJECT:-honeycomb}-mongo
    restart: unless-stopped
    networks: [honeycomb-net]
    volumes:
      - honeycomb_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nexus-core:
    # 不复制代码：build context 直接指到模块目录。模块本身是独立可用的，
    # 组装层只借它的 Dockerfile 把它跑起来（module.yaml 的 service.build 字段
    # 说的就是这条路径，装配器与人读的是同一份事实）。
    build:
      context: ../modules/nexus-core/code/backend
    # 镜像名带项目名、且每次 up 都按源码构建。写死 `nexus-core:local` 时，
    # 机器上已有同名镜像（另一套部署、或 git pull 之前的旧版），compose
    # **不报错**就拿它跑——跑的根本不是你眼前这份代码。2026-09-22 实测撞上。
    image: ${HONEYCOMB_PROJECT:-honeycomb}-nexus-core:local
    pull_policy: build
    container_name: ${HONEYCOMB_PROJECT:-honeycomb}-nexus-core
    restart: unless-stopped
    networks: [honeycomb-net]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NEXUS_MONGO_URI: mongodb://mongo:27017
      NEXUS_DB_NAME: ${HONEYCOMB_DB_NAME:-honeycomb}
      NEXUS_TZ: ${HONEYCOMB_TZ:-Asia/Shanghai}
      # 多用户部署设 1：请求没带租户就 401，而不是悄悄落进共用的 u_local。
      NEXUS_TENANT_STRICT: ${NEXUS_TENANT_STRICT:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/core/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth:
    # 同样不复制代码：只读挂载契约的占位实现（一个零依赖的标准库脚本），
    # 用官方 python 镜像跑它，不给它单独 build 一层镜像。
    image: python:3.12-slim
    container_name: ${HONEYCOMB_PROJECT:-honeycomb}-auth
    restart: unless-stopped
    networks: [honeycomb-net]
    volumes:
      - ../contracts/auth.gate.v1/stub/auth_stub.py:/app/auth_stub.py:ro
      - honeycomb_auth_data:/data
    command: python /app/auth_stub.py
    environment:
      # 共享口令，无默认值。没设它、账号文件里也没账号时 auth_stub.py 直接 sys.exit
      # 拒绝启动，web 依赖它健康，于是整个 `docker compose up` 失败并点名 auth。
      #
      # 这里**不再**用 compose 的 `:?` 兜一层：`:?` 在解析文件时就求值，部署方用
      # override 把 auth 整个换成自己的认证服务时（contracts/gateway.v1），
      # 也会被逼着给一个用不上的口令。
      AUTH_PASSWORD: ${HONEYCOMB_PASSWORD:-}
      # 账号+密码登录（auth.gate v1.1）。每个账号一份自己的数据。加账号：
      #   docker compose run --rm auth python /app/auth_stub.py adduser <名字>
      # 多用户部署：去掉 HONEYCOMB_PASSWORD，并设 NEXUS_TENANT_STRICT=1。
      AUTH_USERS_FILE: /data/users.json
      # 站点前缀（gateway.v1）：cookie 的 Path 跟着它走。
      AUTH_BASE_PATH: ${HONEYCOMB_BASE_PATH:-/}
      # 不设则每次启动随机生成：重启即所有人重新登录。
      AUTH_SECRET: ${AUTH_SECRET:-}
      # 0.0.0.0 在这里是安全的：这台监听只在 honeycomb-net 这个内部 bridge 网里，
      # 本服务在 compose 里根本不映射宿主端口（跟 nexus-core 的 0.0.0.0:8000 同一个道理，
      # 见 modules/nexus-core/code/backend/Dockerfile 的同款注释）。
      # 契约里"不得为 0.0.0.0"那条防的是裸机部署直接对外监听，不是这种场景。
      AUTH_BIND: 0.0.0.0:8010
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/auth/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: ${HONEYCOMB_PROJECT:-honeycomb}-web
    restart: unless-stopped
    networks: [honeycomb-net]
    depends_on:
      nexus-core:
        condition: service_healthy
      # required: false —— 部署方用 override 把占位认证服务整个关掉
      # （`auth: {profiles: [disabled]}`）、换成自己的认证服务时，这条依赖自动失效，
      # 不必改本文件（contracts/gateway.v1）。auth 在的时候照样等它健康再起。
      auth:
        condition: service_healthy
        required: false
    ports:
      - "${HONEYCOMB_BIND:-127.0.0.1:8800}:80"
    # 网关的对外冻结接口见 contracts/gateway.v1/contract.md。部署方用自己的
    # .env 或 `-f 自己的 override.yml` 换认证服务、换登录页、加路由，不改本文件。
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-auth:8010}
      # 站点前缀：gateway.v1 预留，本版固定 `/`（不从 .env 读，免得设了却不生效）。
      # 站点前缀（gateway.v1）：整站挂子路径时设，如 /Cockpit/（以 / 开头和结尾）。
      HONEYCOMB_BASE_PATH: ${HONEYCOMB_BASE_PATH:-/}
      # 模板里只替换这些变量；$host 之类仍是 nginx 自己的。
      NGINX_ENVSUBST_FILTER: ^(AUTH_UPSTREAM|HONEYCOMB_)
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${HONEYCOMB_EXTRA_ROUTES_DIR:-./nginx/extra}:/etc/nginx/templates/extra:ro
      - ../modules/nginx-docker/nginx:/etc/nginx/honeycomb:ro
      - ../modules/nginx-docker/static:/usr/share/nginx/html/__cockpit:ro
      # 登录页，缺省是登录门占位件自带的；换成自己的就设 HONEYCOMB_LOGIN_DIR。
      - ${HONEYCOMB_LOGIN_DIR:-../contracts/auth.gate.v1/stub/web}:/usr/share/nginx/html/login:ro
      # 两个前端模块，同样只读挂载、不复制代码：改页面去 modules/<名>/code/frontend/
      # 改，浏览器刷新就生效，不用重建任何镜像。
      - ../modules/hive/code/frontend:/usr/share/nginx/html/hive:ro
      - ../modules/ring/code/frontend:/usr/share/nginx/html/ring:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
